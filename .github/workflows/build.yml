name: Personal iPhone build
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned source
        run: |
          git init src
          git -C src fetch --depth 1 https://github.com/thomasdye12/TDS-Carplay.git 67659078a405102c7120e1d0962d3f03816ac12d
          git -C src checkout --detach FETCH_HEAD
      - name: Remove runtime overrides
        working-directory: src
        run: |
          for f in 'TDS Video/AVPlayerViewController+ButtonInteractionSwizzling.m' 'TDS Video/AVPlayerViewController.m' 'TDS Video/CPTemplateApplicationScene+Swizzle.m'; do
            test -s "$f"
            echo '// Runtime overrides excluded from this personal build.' > "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          p = Path("CarPlaySceneDelegate.swift")
          s = p.read_text()
          a = s.index("extension CPTemplateApplicationScene {")
          b = s.index("class CarPlaySceneDelegate:", a)
          p.write_text(s[:a] + s[b:])
          PY
      - name: Apply browser orientation fix
        run: |
          python3 - src <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          p=root/'ScreenRec/SampleHandler.swift'
          s=p.read_text()
          s=s.replace('    // MARK: - Network Connection', '''    private let browserContext = CIContext()
              // ReplayKit calls sample-buffer callbacks serially; control messages arrive on a network queue.
              private var lastCaptureOrientation: CGImagePropertyOrientation = .up
              private var viewerOrientation: CGImagePropertyOrientation = .up
              private let orientationLock = NSLock()
          
              private func renderBrowserFrame(_ sample: CMSampleBuffer) {
                  guard let buffer = CMSampleBufferGetImageBuffer(sample) else { return }
                  if let number = CMGetAttachment(sample, key: RPVideoSampleOrientationKey as CFString,
                                                  attachmentModeOut: nil) as? NSNumber,
                     let value = CGImagePropertyOrientation(rawValue: number.uint32Value) {
                      // Correct the half-turn observed in both landscape broadcasts.
                      switch value {
                      case .left: lastCaptureOrientation = .right
                      case .right: lastCaptureOrientation = .left
                      case .leftMirrored: lastCaptureOrientation = .rightMirrored
                      case .rightMirrored: lastCaptureOrientation = .leftMirrored
                      default: lastCaptureOrientation = value
                      }
                  }
                  orientationLock.lock()
                  let offset = viewerOrientation
                  orientationLock.unlock()
                  let upright = CIImage(cvPixelBuffer: buffer).oriented(lastCaptureOrientation)
                  let display = upright.oriented(offset)
                  if let image = browserContext.createCGImage(display, from: display.extent) {
                      HTTPServer.shared.send(image: image)
                  }
              }
          
              // MARK: - Network Connection''')
          s=s.replace('        connect()\n    }','        HTTPServer.shared.Start()\n        connect()\n    }',1).replace('        HTTPServer.shared.Start()\n        videoEncoder','        videoEncoder')
          s=s.replace('minimumIncompleteLength: 2, maximumLength: 2048','minimumIncompleteLength: 1, maximumLength: 1')
          a=s.index('                    let message =')
          b=s.index('                        self.videoEncoder',a)
          s=s[:a]+'''                    let command = data[data.startIndex]
                              if let orientation = CGImagePropertyOrientation(rawValue: UInt32(command)) {
                                  self.orientationLock.lock()
                                  self.viewerOrientation = orientation
                                  self.orientationLock.unlock()
                              }
                              if command == 0x52 {
          '''+s[b:]
          s=s.replace('if message == "STOP"', 'if command == 0x53')
          a=s.index('                guard let imageBuffer',s.index('override func processSampleBuffer'))
          b=s.index('            }\n           \n',a)
          s=s[:a]+'                renderBrowserFrame(sampleBuffer)\n'+s[b:]
          p.write_text(s)
          p=root/'TDS Video/ScreenCaptureManager.swift'
          s=p.read_text().replace('            ScreenCaptureManager.shared.UpdateOrientation(selectedOrientation)','            publishBrowserOrientation(on: connection)\n            UpdateOrientation(selectedOrientation)')
          i=s.index('    func UpdateOrientation')
          s=s[:i]+'''    private func publishBrowserOrientation(on connection: NWConnection?) {
                  // The existing app-to-extension control channel carries one byte per command.
                  let value: CGImagePropertyOrientation
                  switch selectedOrientation {
                  case .up: value = .up
                  case .down: value = .down
                  case .left: value = .left
                  case .right: value = .right
                  case .upMirrored: value = .upMirrored
                  case .downMirrored: value = .downMirrored
                  case .leftMirrored: value = .leftMirrored
                  case .rightMirrored: value = .rightMirrored
                  }
                  connection?.send(content: Data([UInt8(value.rawValue)]), completion: .idempotent)
              }
          
          '''+s[i:]
          s=s.replace('                    print("Server-side: Connection is ready:', '''                    DispatchQueue.main.async {
                                  self.publishBrowserOrientation(on: newConnection)
                              }
                              print("Server-side: Connection is ready:''')
          s=s.replace('"RECONNECT".data(using: .utf8) ?? Data()', 'Data([0x52])').replace('"STOP".data(using: .utf8) ?? Data()', 'Data([0x53])')
          p.write_text(s)
          p=root/'TDS Video/HTTPServer.swift'
          s=p.read_text().replace('    var currentFrame: CGImage?', '''    private let frameLock = NSLock()
              private var latestFrame: CGImage?
              private var currentFrame: CGImage? {
                  frameLock.lock()
                  defer { frameLock.unlock() }
                  return latestFrame
              }''').replace('        currentFrame = image','        frameLock.lock()\n        latestFrame = image\n        frameLock.unlock()')
          p.write_text(s)
          PY
      - name: Add driving dashboard
        run: |
          cp Dashboard.swift "src/TDS Video/VIews/Dashboard.swift"
          python3 - <<'PY'
          from pathlib import Path
          scene = Path("src/TDS Video/SceneDelegate.swift")
          activation = "ScreenCaptureManager.shared.InForeground()"
          contents = scene.read_text()
          assert contents.count(activation) == 1
          scene.write_text(contents.replace(activation, activation + "\n           DashboardHost.shared.resume()"))
          p = Path("src/TDS Video/VIews/MainView.swift")
          s = p.read_text()
          marker = '                NavigationLink(destination: WebServerPage())'
          assert s.count(marker) == 1
          p.write_text(s.replace(marker, '''                NavigationLink(destination: DashboardSetup()) {
                              Label("Driving dashboard", systemImage: "car")
                          }
          ''' + marker))
          PY
      - name: Build for iPhone
        working-directory: src
        run: |
          set -o pipefail
          export DEVELOPER_DIR="$(python3 -c 'import glob,re; p=glob.glob("/Applications/Xcode_26*.app"); print(max(p,key=lambda s:tuple(map(int,re.findall(r"[0-9]+",s)))))')/Contents/Developer"
          xcodebuild -version
          xcodebuild -quiet -project 'TDS Video.xcodeproj' -scheme 'TDS Video' -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/tds" -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=8 build
      - name: Package and encrypt
        run: |
          mkdir Payload
          cp -R "$RUNNER_TEMP/tds/Build/Products/Release-iphoneos/TDS Video.app" Payload/
          binary="Payload/TDS Video.app/TDS Video"
          test -s "$binary"
          strings "$binary" > "$RUNNER_TEMP/strings"
          if grep -Eq 'bypass_clientPushedIllegalTemplateOfClass|xyz_shouldCreateCarWindow|xyz__supportsCarFullScreen' "$RUNNER_TEMP/strings"; then exit 1; fi
          ditto -c -k --keepParent Payload TDS.ipa
          shasum -a 256 TDS.ipa
          "$(brew --prefix openssl@3)/bin/openssl" cms -encrypt -binary -aes-256-cbc -outform DER -in TDS.ipa -out personal.cms recipient.pem
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-personal-build
          path: personal.cms
          retention-days: 1
